name: MCP validation
on:
  pull_request:
    paths: ["src/**", "docker/**", ".github/workflows/mcp-*.yml"]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: mcp-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: src/go.sum
      - name: Unit and integration tests
        run: go test -count=1 -timeout 10m ./...
      - name: Vet
        run: go vet ./...
      - name: MCP race tests
        run: go test -race -count=1 -timeout 5m ./ui/mcp/... ./infrastructure/mcpstore
      - name: Build native application
        run: go build -trimpath -o /tmp/gowa .
