name: MCP GHCR
on:
  push:
    branches: [main]
    paths: ['src/**', 'docker/**', 'docs/mcp-tools.json', 'scripts/mcp-container-smoke.py', 'scripts/verify-ghcr-public.py', '.github/workflows/mcp-*.yml', '.dockerignore']
    tags: ['mcp-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-ghcr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/mcp-ci.yml
  build:
    if: github.repository == 'yusoofsh/go-whatsapp-web-multidevice'
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/mcp.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=mcp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mcp-${{ matrix.arch }}
          provenance: mode=min
      - name: Smoke-test the published image on its native architecture
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" --help | grep -- '--mcp-streaming-enabled'
          docker run -d --name gowa-smoke -p 127.0.0.1:3001:3001 \
            -e APP_BASIC_AUTH=ci:temporary-ci-password-not-a-real-account -e APP_UI_ENABLED=false \
            -e MCP_ENABLED=true -e MCP_STREAMING_ENABLED=true -e MCP_OAUTH_ENABLED=true \
            -e MCP_OAUTH_ISSUER_URL=https://mcp-ci.example.com \
            "$IMAGE"
          trap 'docker logs gowa-smoke; docker rm -f gowa-smoke' EXIT
          MCP_BASE_URL=http://127.0.0.1:3001 python3 scripts/mcp-container-smoke.py
      - name: Save tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digests
          printf '%s' "$DIGEST" > "/tmp/digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mcp-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify multi-architecture manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          amd64="$(cat /tmp/digests/amd64)"
          arm64="$(cat /tmp/digests/arm64)"
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          tags=(-t "$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(-t "$image:latest" -t "$image:mcp" -t "$image:mcp-parity"); fi
          if [[ "$GITHUB_REF" == refs/tags/mcp-v* ]]; then tags+=(-t "$image:${GITHUB_REF_NAME}"); fi
          docker buildx imagetools create "${tags[@]}" "$image@$amd64" "$image@$arm64"
          docker buildx imagetools inspect --raw "$image:sha-$GITHUB_SHA" > /tmp/manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          p={(x.get('platform',{}).get('os'),x.get('platform',{}).get('architecture')) for x in m['manifests']}
          assert {('linux','amd64'),('linux','arm64')}.issubset(p),p
          print('Verified linux/amd64 and linux/arm64 manifest')
          PY
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify public anonymous access and exact source revision
        run: python3 scripts/verify-ghcr-public.py | tee -a "$GITHUB_STEP_SUMMARY"
