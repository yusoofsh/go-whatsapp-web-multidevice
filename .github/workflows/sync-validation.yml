name: Upstream sync validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Check merged transport formatting
        run: test -z "$(gofmt -l ui/mcp/schemas.go ui/mcp/send.go)"
      - name: Verify module graph and checksums
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Unit and integration tests with temporary stores and mocks
        run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/gowa-sync-check .
